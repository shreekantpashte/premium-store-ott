<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | PremiumStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-primary: #050816;
            --bg-secondary: #0C1126;
            --card-bg: rgba(16, 22, 48, 0.75);
            --accent-purple: #7C3AED;
            --accent-green: #22C55E;
            --btn-gradient: linear-gradient(90deg, #7C3AED, #4F46E5);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-light: #D4D7E5;
            --text-muted: #8A90A2;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body { margin: 0; background: var(--bg-primary); color: #ffffff; background-image: radial-gradient(circle at top right, rgba(124,58,237,.12), transparent 40%), radial-gradient(circle at bottom left, rgba(37,99,235,.12), transparent 40%); background-attachment: fixed; min-height: 100vh; }
        .glass { background: var(--card-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--border-color); }
        
        nav { position: sticky; top: 0; z-index: 50; height: 82px; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; border-bottom: 1px solid var(--border-color); background: rgba(5,8,22,0.8); backdrop-filter: blur(10px); }
        .nav-links { display: flex; align-items: center; gap: 30px; }
        .nav-links a { color: #D4D7E5; text-decoration: none; font-weight: 600; }
        .nav-links a:hover { color: #fff; }
        .cart-badge { background: var(--accent-purple); color: white; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; position: absolute; top: -8px; right: -12px; }

        .container { max-width: 1320px; margin: 0 auto; padding: 40px; }
        .breadcrumb { font-size: 13px; color: var(--text-muted); margin-bottom: 30px; display: flex; gap: 8px; }
        .breadcrumb a { color: var(--text-muted); text-decoration: none; }

        .product-top { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-bottom: 40px; }
        .main-image { width: 100%; height: 400px; object-fit: cover; border-radius: 24px; background: #000; border: 1px solid var(--border-color); }
        
        .badges { display: flex; gap: 10px; margin-bottom: 16px; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; border: 1px solid var(--border-color); }
        .badge.purple { background: rgba(124,58,237,0.15); color: #A78BFA; }
        .badge.green { background: rgba(34,197,94,0.15); color: #4ADE80; }

        .product-title { font-size: 36px; font-weight: 800; margin: 0 0 8px 0; }
        .price-box { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .price { font-size: 42px; font-weight: 800; }
        .old-price { font-size: 20px; color: var(--text-muted); text-decoration: line-through; }
        .discount-tag { background: var(--btn-gradient); padding: 4px 12px; border-radius: 8px; font-weight: 700; font-size: 14px; }

        .features-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 32px; }
        .feature-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-light); }
        .feature-item i { color: var(--accent-purple); }

        .actions { display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px; }
        .btn-buy { background: var(--btn-gradient); color: white; border: none; padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 8px 25px rgba(124,58,237,.45); transition: 0.3s; }
        .btn-buy:hover { opacity: 0.9; }

        .btn-whatsapp { background: #22C55E; color: white; border: none; padding: 16px; border-radius: 16px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; }
        .btn-whatsapp:hover { opacity: 0.9; }

        /* Cart Drawer */
        #cart-drawer { position: fixed; top: 0; right: -400px; width: 380px; height: 100vh; background: #0C1126; border-left: 1px solid var(--border-color); z-index: 1000; transition: right 0.4s ease; display: flex; flex-direction: column; padding: 24px; }
        #cart-drawer.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 20px; }
        .cart-items { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); }
        .cart-footer { border-top: 1px solid var(--border-color); padding-top: 20px; margin-top: 20px; }
        .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 999; display: none; }
    </style>
</head>
<body>

    <div class="backdrop" id="cart-backdrop" onclick="toggleCart()"></div>
    <div id="cart-drawer" class="glass">
        <div class="cart-header"><h3>Your Shopping Cart</h3><button onclick="toggleCart()" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">&times;</button></div>
        <div class="cart-items" id="cart-items-container"></div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 12px;"><span>Total:</span><span id="cart-total">₹0</span></div>
            <button class="btn-whatsapp" onclick="checkoutWhatsApp()"><i data-lucide="message-circle"></i> Checkout via WhatsApp</button>
        </div>
    </div>

    <nav class="glass">
        <div style="font-size: 24px; font-weight: 800;"><a href="index.html" style="color:white; text-decoration:none;">PremiumStore</a></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
        </div>
        <div style="display:flex; gap:20px; align-items:center; cursor:pointer;" onclick="toggleCart()">
            <div style="position:relative; display:flex; align-items:center; gap:6px; color:white;"><i data-lucide="shopping-cart"></i> Cart <span class="cart-badge" id="cart-count">0</span></div>
        </div>
    </nav>

    <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> &rsaquo; <a href="shop.html" id="bc-category">Category</a> &rsaquo; <span id="bc-title" style="color: white;">Product Name</span></div>

        <div class="product-top">
            <div><img src="" id="main-img" class="main-image" alt="Product Image"></div>
            <div>
                <div class="badges"><span class="badge purple">Best Seller</span><span class="badge green">Genuine</span></div>
                <h1 class="product-title" id="p-title">Product Title</h1>
                <p style="color:var(--text-muted); margin-bottom:20px;">Official Premium Plan | Personal Account | Works Worldwide</p>

                <div class="price-box">
                    <span class="price" id="p-price">₹0</span>
                    <span class="old-price" id="p-old-price">₹0</span>
                    <span class="discount-tag" id="p-discount">0% OFF</span>
                </div>

                <div class="features-grid" id="p-features"></div>

                <div class="actions">
                    <button class="btn-buy" id="btn-add-cart"><i data-lucide="shopping-cart"></i> Add to Cart</button>
                    <button class="btn-whatsapp" onclick="orderWhatsAppDirect()"><i data-lucide="message-circle"></i> Order on WhatsApp Now</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const SUPABASE_URL = 'https://ognjizizksfapgnnwgld.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_O6_YMG5VN9PNyRUAkLn-vg_WWfPeJEb';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentProduct = null;

        async function loadProduct() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            if (!productId) { window.location.href = 'shop.html'; return; }

            const { data, error } = await db.from('products').select('*').eq('id', productId).single();
            if (error || !data) { alert('Product not found'); window.location.href = 'shop.html'; return; }

            currentProduct = data;
            document.title = `${data.title} | PremiumStore`;
            document.getElementById('bc-category').innerText = data.category.toUpperCase();
            document.getElementById('bc-title').innerText = data.title;
            document.getElementById('p-title').innerText = data.title;
            document.getElementById('p-price').innerText = `₹${data.price}`;
            document.getElementById('p-old-price').innerText = `₹${data.old_price}`;
            document.getElementById('p-discount').innerText = `${data.discount_percentage}% OFF`;
            document.getElementById('main-img').src = data.image_url || 'https://via.placeholder.com/600x400';

            const featuresContainer = document.getElementById('p-features');
            if (data.features) {
                data.features.forEach(f => featuresContainer.innerHTML += `<div class="feature-item"><i data-lucide="check" style="width:18px;"></i> ${f}</div>`);
            }
            lucide.createIcons();
            updateCartUI();

            document.getElementById('btn-add-cart').onclick = () => {
                addToCart(data.id, data.title, data.price);
            };
        }

        function getCart() { return JSON.parse(localStorage.getItem('ps_cart') || '[]'); }
        function saveCart(cart) { localStorage.setItem('ps_cart', JSON.stringify(cart)); updateCartUI(); }
        function addToCart(id, title, price) {
            let cart = getCart();
            let item = cart.find(i => i.id === id);
            if(item) { item.qty += 1; } else { cart.push({ id, title, price, qty: 1 }); }
            saveCart(cart);
            toggleCart();
        }
        function removeFromCart(id) { saveCart(getCart().filter(i => i.id !== id)); }
        function updateCartUI() {
            const cart = getCart();
            document.getElementById('cart-count').innerText = cart.reduce((sum, i) => sum + i.qty, 0);
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            if(cart.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:40px;">Your cart is empty.</p>';
                document.getElementById('cart-total').innerText = '₹0';
                return;
            }
            let total = 0;
            cart.forEach(item => {
                total += (item.price * item.qty);
                container.innerHTML += `
                    <div class="cart-item">
                        <div><div style="font-weight:600; font-size:14px;">${item.title}</div><div style="font-size:12px; color:var(--text-muted);">₹${item.price} × ${item.qty}</div></div>
                        <button onclick="removeFromCart('${item.id}')" style="background:none; border:none; color:#EF4444; cursor:pointer;">Remove</button>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = `₹${total}`;
        }
        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('open');
            document.getElementById('cart-backdrop').style.display = document.getElementById('cart-drawer').classList.contains('open') ? 'block' : 'none';
        }
        function orderWhatsAppDirect() {
            if(!currentProduct) return;
            const msg = `Hi PremiumStore! I want to buy *${currentProduct.title}* for ₹${currentProduct.price}. Please help me with the payment details.`;
            window.open(`https://wa.me/919967566736?text=${encodeURIComponent(msg)}`, '_blank');
        }
        function checkoutWhatsApp() {
            const cart = getCart();
            if(cart.length === 0) { alert('Your cart is empty!'); return; }
            let msg = "Hi PremiumStore! I want to place an order for the following items:\n\n";
            let total = 0;
            cart.forEach((item, index) => {
                msg += `${index + 1}. *${item.title}* - ₹${item.price} x ${item.qty} = ₹${item.price * item.qty}\n`;
                total += (item.price * item.qty);
            });
            msg += `\n*Total Amount: ₹${total}*\nPlease help me proceed with the payment.`;
            window.open(`https://wa.me/919967566736?text=${encodeURIComponent(msg)}`, '_blank');
        }

        loadProduct();
    </script>
</body>
</html>
