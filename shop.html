<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | PremiumStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-primary: #050816;
            --bg-secondary: #0C1126;
            --card-bg: rgba(16, 22, 48, 0.75);
            --accent-purple: #7C3AED;
            --accent-green: #22C55E;
            --btn-gradient: linear-gradient(90deg, #7C3AED, #4F46E5);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-muted: #8A90A2;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            margin: 0; background: var(--bg-primary); color: #ffffff;
            background-image: radial-gradient(circle at top right, rgba(124,58,237,.12), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(37,99,235,.12), transparent 40%);
            background-attachment: fixed; min-height: 100vh; overflow-x: hidden;
        }

        .glass { background: var(--card-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--border-color); }
        
        nav { position: sticky; top: 0; z-index: 50; height: 82px; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; border-bottom: 1px solid var(--border-color); background: rgba(5,8,22,0.8); backdrop-filter: blur(10px); }
        .nav-links { display: flex; align-items: center; gap: 30px; }
        .nav-links a { color: #D4D7E5; text-decoration: none; font-weight: 600; }
        .nav-links a:hover { color: #fff; }
        
        .nav-icons { display: flex; gap: 24px; align-items: center; color: #D4D7E5; cursor: pointer; }
        .cart-badge { background: var(--accent-purple); color: white; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; position: absolute; top: -8px; right: -12px; }

        .btn-primary { background: var(--btn-gradient); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { opacity: 0.9; }

        .shop-container { display: flex; max-width: 1440px; margin: 40px auto; padding: 0 40px; gap: 40px; }
        .sidebar { width: 280px; flex-shrink: 0; border-radius: 20px; padding: 24px; height: fit-content; position: sticky; top: 120px; }
        .filter-section { margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 24px; }
        .filter-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        .radio-group label { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 14px; color: var(--text-muted); cursor: pointer; }
        .radio-group input { accent-color: var(--accent-purple); width: 16px; height: 16px; }
        .price-slider { width: 100%; accent-color: var(--accent-purple); }
        select.sort-select { width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: white; border-radius: 8px; outline: none; }

        .product-area { flex: 1; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-title { font-size: 32px; font-weight: 800; margin: 0; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
        .product-card { border-radius: 20px; padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.35); transition: 0.4s; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card:hover { transform: translateY(-8px); border-color: rgba(124,58,237,.5); }
        .product-image { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; background: #000; }
        .discount-badge { background: var(--btn-gradient); padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .price { color: var(--accent-purple); font-weight: 700; font-size: 20px; }
        .old-price { font-size: 13px; text-decoration: line-through; color: var(--text-muted); margin-left: 5px; }

        /* Cart Drawer */
        #cart-drawer { position: fixed; top: 0; right: -400px; width: 380px; height: 100vh; background: #0C1126; border-left: 1px solid var(--border-color); z-index: 1000; transition: right 0.4s ease; display: flex; flex-direction: column; padding: 24px; }
        #cart-drawer.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 20px; }
        .cart-items { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); }
        .cart-footer { border-top: 1px solid var(--border-color); padding-top: 20px; margin-top: 20px; }
        .btn-whatsapp-checkout { background: #22C55E; color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 12px; }
        .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 999; display: none; }
    </style>
</head>
<body>

    <div class="backdrop" id="cart-backdrop" onclick="toggleCart()"></div>
    <div id="cart-drawer" class="glass">
        <div class="cart-header"><h3>Your Shopping Cart</h3><button onclick="toggleCart()" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">&times;</button></div>
        <div class="cart-items" id="cart-items-container"></div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 12px;"><span>Total:</span><span id="cart-total">₹0</span></div>
            <button class="btn-whatsapp-checkout" onclick="checkoutWhatsApp()"><i data-lucide="message-circle"></i> Checkout via WhatsApp</button>
        </div>
    </div>

    <nav class="glass">
        <div style="font-size: 24px; font-weight: 800;"><a href="index.html" style="color:white; text-decoration:none;">PremiumStore</a></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html" style="color: white;">Shop</a>
            <a href="#">Support</a>
        </div>
        <div class="nav-icons" style="display:flex; gap:20px;">
            <div onclick="toggleCart()" style="position:relative; display:flex; align-items:center; gap:6px;"><i data-lucide="shopping-cart"></i> Cart <span class="cart-badge" id="cart-count">0</span></div>
        </div>
    </nav>

    <div class="shop-container">
        <aside class="sidebar glass">
            <div class="filter-section">
                <div class="filter-title">Categories</div>
                <div class="radio-group">
                    <label><input type="radio" name="category" value="all" checked onchange="fetchProducts()"> All Products</label>
                    <label><input type="radio" name="category" value="ott" onchange="fetchProducts()"> 🎬 OTT Subscriptions</label>
                    <label><input type="radio" name="category" value="ai" onchange="fetchProducts()"> 🤖 AI Tools</label>
                    <label><input type="radio" name="category" value="editing" onchange="fetchProducts()"> 🎨 Editing Tools</label>
                    <label><input type="radio" name="category" value="education" onchange="fetchProducts()"> 🎓 Education</label>
                    <label><input type="radio" name="category" value="other" onchange="fetchProducts()"> 🛒 Other Plans</label>
                    <label><input type="radio" name="category" value="bundles" onchange="fetchProducts()"> 📦 Digital Bundles</label>
                </div>
            </div>
            <div class="filter-section">
                <div class="filter-title">Max Price (₹) <span id="price-display">5000</span></div>
                <input type="range" id="price-range" class="price-slider" min="50" max="5000" value="5000" step="50" oninput="updatePriceDisplay()" onchange="fetchProducts()">
            </div>
            <div class="filter-section">
                <div class="filter-title">Sort By</div>
                <select id="sort-by" class="sort-select" onchange="fetchProducts()">
                    <option value="newest">Newest Arrivals</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                </select>
            </div>
        </aside>

        <div class="product-area">
            <div class="page-header"><h1 class="page-title" id="shop-title">All Products</h1><div id="product-count" style="color: var(--text-muted);">Loading...</div></div>
            <div class="product-grid" id="product-container"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const SUPABASE_URL = 'https://ognjizizksfapgnnwgld.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_O6_YMG5VN9PNyRUAkLn-vg_WWfPeJEb';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function updatePriceDisplay() {
            document.getElementById('price-display').innerText = document.getElementById('price-range').value;
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryFromUrl = urlParams.get('category');
            if (categoryFromUrl) {
                const radio = document.querySelector(`input[name="category"][value="${categoryFromUrl}"]`);
                if (radio) radio.checked = true;
            }
            updateCartUI();
            fetchProducts();
        };

        // Cart Logic
        function getCart() { return JSON.parse(localStorage.getItem('ps_cart') || '[]'); }
        function saveCart(cart) { localStorage.setItem('ps_cart', JSON.stringify(cart)); updateCartUI(); }
        function addToCart(id, title, price) {
            let cart = getCart();
            let item = cart.find(i => i.id === id);
            if(item) { item.qty += 1; } else { cart.push({ id, title, price, qty: 1 }); }
            saveCart(cart);
            toggleCart();
        }
        function removeFromCart(id) { saveCart(getCart().filter(i => i.id !== id)); }
        function updateCartUI() {
            const cart = getCart();
            document.getElementById('cart-count').innerText = cart.reduce((sum, i) => sum + i.qty, 0);
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            if(cart.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:40px;">Your cart is empty.</p>';
                document.getElementById('cart-total').innerText = '₹0';
                return;
            }
            let total = 0;
            cart.forEach(item => {
                total += (item.price * item.qty);
                container.innerHTML += `
                    <div class="cart-item">
                        <div><div style="font-weight:600; font-size:14px;">${item.title}</div><div style="font-size:12px; color:var(--text-muted);">₹${item.price} × ${item.qty}</div></div>
                        <button onclick="removeFromCart('${item.id}')" style="background:none; border:none; color:#EF4444; cursor:pointer;">Remove</button>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = `₹${total}`;
        }
        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('open');
            document.getElementById('cart-backdrop').style.display = document.getElementById('cart-drawer').classList.contains('open') ? 'block' : 'none';
        }
        function checkoutWhatsApp() {
            const cart = getCart();
            if(cart.length === 0) { alert('Your cart is empty!'); return; }
            let msg = "Hi PremiumStore! I want to place an order for the following items:\n\n";
            let total = 0;
            cart.forEach((item, index) => {
                msg += `${index + 1}. *${item.title}* - ₹${item.price} x ${item.qty} = ₹${item.price * item.qty}\n`;
                total += (item.price * item.qty);
            });
            msg += `\n*Total Amount: ₹${total}*\nPlease help me proceed with the payment.`;
            window.open(`https://wa.me/919967566736?text=${encodeURIComponent(msg)}`, '_blank');
        }

        async function fetchProducts() {
            const container = document.getElementById('product-container');
            const activeCategory = document.querySelector('input[name="category"]:checked').value;
            const maxPrice = document.getElementById('price-range').value;
            const sortBy = document.getElementById('sort-by').value;

            let query = db.from('products').select('*');
            if (activeCategory !== 'all') query = query.eq('category', activeCategory);
            query = query.lte('price', maxPrice);
            if (sortBy === 'newest') query = query.order('created_at', { ascending: false });
            if (sortBy === 'price_asc') query = query.order('price', { ascending: true });
            if (sortBy === 'price_desc') query = query.order('price', { ascending: false });

            const { data, error } = await query;
            if (error) { container.innerHTML = 'Failed to load products.'; return; }

            document.getElementById('product-count').innerText = `Showing ${data.length} Results`;
            container.innerHTML = '';
            if (data.length === 0) { container.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:40px;">No products found.</div>'; return; }

            data.forEach(product => {
                const img = product.image_url || 'https://via.placeholder.com/300x200';
                container.innerHTML += `
                    <div class="product-card glass">
                        <a href="product.html?id=${product.id}">
                            <img src="${img}" class="product-image">
                            ${product.discount_percentage ? `<div class="discount-badge">${product.discount_percentage}% OFF</div>` : ''}
                            <h3>${product.title}</h3>
                            <div style="font-size: 12px; color: var(--text-muted);">${product.validity || ''} • ${product.delivery_time || ''}</div>
                        </a>
                        <div style="margin-top:auto; padding-top:15px;">
                            <div class="price">₹${product.price} <span class="old-price">₹${product.old_price || ''}</span></div>
                            <button class="btn-primary" style="width:100%; margin-top:12px; padding:10px; font-size:14px;" onclick="addToCart('${product.id}', '${product.title}', ${product.price})">Add to Cart</button>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
