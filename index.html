<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PremiumStore | OTT & AI Subscriptions</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-primary: #050816; --bg-secondary: #0C1126; --card-bg: rgba(16, 22, 48, 0.75);
            --accent-purple: #7C3AED; --accent-blue: #2563EB; --accent-green: #22C55E;
            --btn-gradient: linear-gradient(90deg, #7C3AED, #4F46E5);
            --border-color: rgba(255, 255, 255, 0.08); --text-light: #D4D7E5; --text-muted: #8A90A2;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body { margin: 0; background: var(--bg-primary); color: #ffffff; background-image: radial-gradient(circle at top right, rgba(124,58,237,.12), transparent 40%), radial-gradient(circle at bottom left, rgba(37,99,235,.12), transparent 40%); background-attachment: fixed; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        .glass { background: var(--card-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--border-color); }
        .container { max-width: 1320px; margin: 0 auto; padding: 0 40px; }
        .text-gradient { background: var(--btn-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-primary { background: var(--btn-gradient); color: white; border: none; padding: 16px 32px; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; box-shadow: 0 8px 25px rgba(124,58,237,.45); transition: 0.3s; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-secondary { background: transparent; color: white; border: 1px solid var(--border-color); padding: 16px 32px; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); }

        /* Navbar */
        nav { position: sticky; top: 0; z-index: 50; height: 82px; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; border-bottom: 1px solid var(--border-color); background: rgba(5,8,22,0.8); backdrop-filter: blur(10px); }
        .nav-links { display: flex; gap: 30px; font-weight: 600; color: #D4D7E5; }
        .nav-links a:hover { color: white; }

        /* Hero */
        .hero { display: flex; align-items: center; min-height: 600px; padding: 80px 0; }
        .hero-left { flex: 1; max-width: 600px; }
        .hero-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 30px; border: 1px solid rgba(124,58,237,0.3); background: rgba(124,58,237,0.1); font-size: 13px; font-weight: 600; color: #A78BFA; margin-bottom: 24px; }
        .hero h1 { font-size: 64px; line-height: 1.1; font-weight: 800; margin: 0 0 24px 0; }
        .hero p { font-size: 17px; color: var(--text-muted); line-height: 1.6; margin-bottom: 40px; }
        .hero-buttons { display: flex; gap: 16px; margin-bottom: 40px; }

        /* General Section & Grid */
        .section { padding: 80px 0; }
        .section-header { text-align: center; margin-bottom: 50px; }
        .section-title { font-size: 36px; font-weight: 800; margin: 0 0 12px 0; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
        .product-card { border-radius: 20px; padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.35); transition: 0.4s; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-8px) scale(1.02); border-color: rgba(124,58,237,.5); }
        .product-image { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; }
        .discount-badge { background: var(--btn-gradient); padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .price { color: var(--accent-purple); font-weight: 700; font-size: 20px; }
        .old-price { font-size: 13px; text-decoration: line-through; color: var(--text-muted); margin-left: 5px; }

    </style>
</head>
<body>
    <nav class="glass">
        <div style="font-size: 24px; font-weight: 800;"><a href="index.html">PremiumStore</a></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="admin.html">Admin</a>
        </div>
    </nav>

    <div class="container">
        <section class="hero">
            <div class="hero-left">
                <div class="hero-badge"><i data-lucide="check-circle-2" style="width:16px;"></i> 100% Genuine Activation</div>
                <h1>Premium Subscriptions<br>Up to <span class="text-gradient">99% Off</span></h1>
                <p>OTT, AI Tools & Social Media Subscriptions. All plans activated on your personal account. Genuine • Secure • Affordable.</p>
                <div class="hero-buttons">
                    <button class="btn-primary" onclick="window.location.href='shop.html'">Shop Now</button>
                    <button class="btn-secondary" onclick="window.open('https://wa.me/919967566736?text=Hi%20PremiumStore!', '_blank')"><i data-lucide="message-circle" style="width:18px;"></i> WhatsApp</button>
                </div>
            </div>
            <div style="flex: 1; display: flex; justify-content: center;">
                <div style="width: 400px; height: 400px; border-radius: 50%; border: 1px solid rgba(124,58,237,0.3); box-shadow: 0 0 100px rgba(124,58,237,0.2);"></div>
            </div>
        </section>

        <section class="section">
            <div class="section-header">
                <h2 class="section-title">Best Sellers</h2>
                <p style="color: var(--text-muted);">Most popular subscriptions with massive discounts</p>
            </div>
            <div class="product-grid" id="best-sellers-container"></div>
        </section>
    </div>

    <script>
        lucide.createIcons();
        const db = supabase.createClient('https://ognjizizksfapgnnwgld.supabase.co', 'sb_publishable_O6_YMG5VN9PNyRUAkLn-vg_WWfPeJEb');

        async function fetchBestSellers() {
            const container = document.getElementById('best-sellers-container');
            const { data, error } = await db.from('products').select('*').order('created_at', { ascending: false }).limit(6);
            if (error) return;

            container.innerHTML = '';
            data.forEach(product => {
                const img = product.image_url || 'https://via.placeholder.com/300x200';
                container.innerHTML += `
                    <div class="product-card glass" onclick="window.location.href='product.html?id=${product.id}'" style="cursor:pointer;">
                        <img src="${img}" class="product-image">
                        ${product.discount_percentage ? `<div class="discount-badge">${product.discount_percentage}% OFF</div>` : ''}
                        <h3 style="margin: 0 0 10px 0; font-size:18px;">${product.title}</h3>
                        <div style="margin-top:auto; padding-top:15px;">
                            <div class="price">₹${product.price} <span class="old-price">₹${product.old_price || ''}</span></div>
                        </div>
                    </div>
                `;
            });
        }
        fetchBestSellers();
    </script>
</body>
</html>
